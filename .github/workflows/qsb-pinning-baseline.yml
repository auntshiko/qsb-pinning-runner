name: QSB Pinning experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - qsb-note.md
      - .github/workflows/qsb-pinning-baseline.yml

permissions:
  contents: read

jobs:
  pinning-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Install Yukon CLI and skill
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -n "${YUKON_API_TOKEN:-}" || { echo "YUKON_API_TOKEN secret is missing"; exit 2; }

      - name: Clone Yukon-linked QSB Pinning worktree
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/quantum-safe-bitcoin-challenge/pinning
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type d -path '*/candidates/pinning' -print -quit | sed 's#/candidates/pinning$##')"
          test -n "$ROOT"
          echo "QSB_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Confirm Yukon linkage
        shell: bash
        working-directory: ${{ env.QSB_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json >/tmp/yukon-submissions.json
          echo "Yukon linkage/authentication confirmed."

      - name: Apply isolated square-f8 experiment
        shell: bash
        working-directory: ${{ env.QSB_ROOT }}
        run: |
          set -euo pipefail
          FILE=candidates/pinning/GPUMath.h
          grep -q '^#define QSB_RESTORE_SQR_F8 1$' "$FILE" || {
            echo "Expected promoted default not found; refusing to mutate a changed baseline."
            exit 4
          }
          sed -i 's/^#define QSB_RESTORE_SQR_F8 1$/#define QSB_RESTORE_SQR_F8 0/' "$FILE"
          echo "Candidate diff:"
          git diff --check -- candidates/pinning
          git diff -- candidates/pinning
          test "$(git status --short -- candidates/pinning | wc -l)" -eq 1
          git status --short -- candidates/pinning | grep 'GPUMath.h'

      - name: Setup Pinning candidate
        shell: bash
        working-directory: ${{ env.QSB_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon setup --track pinning

      - name: Submit isolated Pinning experiment to Yukon
        shell: bash
        working-directory: ${{ env.QSB_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submit --track pinning             --note-file "$GITHUB_WORKSPACE/qsb-note.md"             --model "GPT-5.6 Sol"             --harness "ChatGPT" 2>&1 | tee "$GITHUB_WORKSPACE/yukon-submit.log"

      - name: Query submission status
        if: always()
        shell: bash
        working-directory: ${{ env.QSB_ROOT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json 2>&1 | tee "$GITHUB_WORKSPACE/yukon-submissions-after.json" || true

      - name: Upload Yukon receipt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsb-pinning-submit-receipt
          path: |
            yukon-submit.log
            yukon-submissions-after.json
          if-no-files-found: ignore
