name: SNARK.fast x86 candidate benchmark
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit candidate to Yukon after benchmark gate passes"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  snark-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon CLI
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -n "${YUKON_API_TOKEN:-}"
      - name: Clone linked x86 worktree
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Confirm Yukon linkage
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json > "$GITHUB_WORKSPACE/snark-before.json"
      - name: Benchmark promoted baseline
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export BLAKE3_WARMUP_RUNS=2
          export BLAKE3_RUNS=7
          ./setup.sh
          rm -f score.json
          baseline_ok=0
          for attempt in 1 2 3; do
            echo "Baseline verification attempt $attempt/3"
            if ./benchmark.sh; then
              baseline_ok=1
              break
            fi
            echo "Baseline attempt $attempt failed; retrying unchanged baseline."
            rm -f score.json
          done
          if [ "$baseline_ok" -ne 1 ]; then
            echo "Unchanged baseline failed verification three times; candidate not evaluated."
            exit 1
          fi
          cp score.json "$GITHUB_WORKSPACE/snark-baseline-score.json"
      - name: Apply isolated NTT deep-prefetch removal experiment
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          FILE=crates/flock-core/src/ntt/additive_ntt_f128.rs
          test "$(git rev-parse HEAD)" = "1b55c6ee2c9cae3c807489293199760e5e21d52b"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("crates/flock-core/src/ntt/additive_ntt_f128.rs")
          s=p.read_text()
          old='if std::env::var_os("FLOCK_NO_NTT_DEEP_PF").is_some() {'
          new='if std::env::var_os("FLOCK_NO_NTT_DEEP_PF").is_none() {'
          if s.count(old) != 1:
              raise SystemExit(f"expected exactly one NTT_DEEP_PF selector, found {s.count(old)}")
          p.write_text(s.replace(old,new,1))
          if p.read_text().count(new) != 1:
              raise SystemExit("candidate replacement verification failed")
          PY
          echo "Validated candidate: disable NTT deep-pass L1 prefetch hints" > "$GITHUB_WORKSPACE/snark-candidate.diff"
      - name: Setup x86
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon setup --track x86
      - name: Benchmark candidate gate
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export BLAKE3_WARMUP_RUNS=2
          export BLAKE3_RUNS=7
          ./benchmark.sh
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("score.json")
          d=json.loads(p.read_text())
          print("Candidate benchmark:", json.dumps(d, indent=2))
          score=d.get("score")
          if not isinstance(score,(int,float)) or score <= 0:
              raise SystemExit("benchmark did not produce a positive numeric score")
          pathlib.Path("../../snark-local-score.txt").write_text(str(score)+"\n")
          base=json.loads(pathlib.Path("../../snark-baseline-score.json").read_text()).get("score")
          if not isinstance(base,(int,float)) or base <= 0:
              raise SystemExit("baseline benchmark did not produce a positive numeric score")
          gain=(score/base-1.0)*100.0
          pathlib.Path("../../snark-local-gain.txt").write_text(f"{gain:.6f}\n")
          print(f"Baseline score: {base}; candidate score: {score}; gain: {gain:.3f}%")
          if gain < 2.0:
              raise SystemExit(f"candidate rejected by local gate: {gain:.3f}% < 2.000%")
          PY
      - name: Require explicit Yukon release
        if: ${{ inputs.submit != true }}
        run: |
          echo "Local benchmark completed. Yukon submission withheld by default."
      - name: Submit to Yukon
        if: ${{ inputs.submit == true }}
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submit --track x86 --note-file "$GITHUB_WORKSPACE/snark-x86-note.md" --model "GPT-5.6 Sol" --harness "ChatGPT" 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-submit.log"
      - name: Query status
        if: always()
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-after.json" || true
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-submit-receipt
          path: |
            snark-candidate.diff
            snark-before.json
            yukon-snark-submit.log
            snark-local-score.txt
            snark-local-gain.txt
            snark-baseline-score.json
            yukon-snark-after.json
          if-no-files-found: ignore
