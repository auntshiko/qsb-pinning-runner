name: SNARK.fast x86 candidate benchmark
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit candidate to Yukon after benchmark gate passes"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  snark-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon CLI
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -n "${YUKON_API_TOKEN:-}"
      - name: Clone linked x86 worktree
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Confirm Yukon linkage
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json > "$GITHUB_WORKSPACE/snark-before.json"
      - name: Record runner environment
        run: |
          set -euo pipefail
          echo "ImageOS=${ImageOS:-unknown}" | tee "$GITHUB_WORKSPACE/snark-runner-env.txt"
          echo "ImageVersion=${ImageVersion:-unknown}" | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"
          uname -a | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"
          lscpu | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"

      - name: Prepare benchmark dependencies
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          ./setup.sh

      - name: Record x86 host class
        run: |
          set -euo pipefail
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Benchmark host: $model"
          # EPYC 7763 repeatedly rejects the unchanged trusted baseline at
          # Zerocheck(SumcheckFinalFailed). Skip before costly builds; do not
          # treat this infrastructure skip as proof or performance success.
          if [[ "$model" == *"EPYC 7763"* ]]; then
            echo "::notice::HOST_SKIP_KNOWN_BASELINE_FAILURE: AMD EPYC 7763; trusted baseline historically fails; no candidate measured."
            exit 86
          fi
          # EPYC 9V74 has both passing (#105) and failing (#109) baseline
          # results. Do not blacklist the model; flag intermittent correctness.
          if [[ "$model" == *"EPYC 9V74"* ]]; then
            echo "::notice::HOST_INTERMITTENT_BASELINE_FAILURE: AMD EPYC 9V74; strict 3/3 preflight required; a failed proof is never retried as a pass."
          fi
          # All other hosts still require strict trusted 3/3 proof preflight.
          # CPU identification alone never counts as a correctness pass.
          case "$model" in
            *"XEON"*"8573C"*|*"Xeon"*"8573C"*)
              echo "HOST_CLASS=known-valid-reference"
              ;;
            *)
              echo "HOST_CLASS=unclassified; requiring strict 3/3 trusted preflight"
              ;;
          esac

      - name: Capture prover nondeterminism diagnostics
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          echo "=== SOURCE REVISION ===" | tee "$GITHUB_WORKSPACE/snark-divergence.log"
          git rev-parse HEAD | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          echo "=== OPTIMIZATION SELECTORS ===" | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          grep -RIn --include='*.rs' -E 'FLOCK_NO_|target_feature|is_x86_feature_detected|par_iter|into_par_iter|rayon' crates/flock-core crates/flock-prover 2>/dev/null \
            | tee -a "$GITHUB_WORKSPACE/snark-divergence.log" || true
          echo "=== ZEROCHECK / SUMCHECK CALL SITES ===" | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          grep -RIn --include='*.rs' -E 'zerocheck|Zerocheck|sumcheck|Sumcheck' crates 2>/dev/null \
            | tee -a "$GITHUB_WORKSPACE/snark-divergence.log" || true
          echo "=== CPU FEATURE ENVIRONMENT ===" | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          lscpu | grep -E 'Model name|Flags' | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          rustc +1.97.0 -vV | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"

      - name: Inspect proof serialization and verifier source
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          {
            echo "=== PROOF SERIALIZATION ==="
            sed -n '145,215p' crates/flock-prover/src/proof_io.rs
            sed -n '385,435p' crates/flock-prover/src/proof_io.rs
            echo "=== ZEROCHECK VERIFICATION ==="
            sed -n '120,205p' crates/flock-core/src/verifier.rs
            echo "=== ZEROCHECK SUMCHECK FAILURE SITES ==="
            grep -RIn -C 6 'SumcheckFinalFailed' crates/flock-core/src
            echo "=== PROOF WRITER CALL SITES ==="
            grep -RIn -C 3 'write_proof\|serialize_proof\|proof_io::' crates/flock-prover/src benchmark-tools 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/snark-proof-source-inspection.txt"
          echo "Proof serialization/verifier source captured in artifact."

      - name: Record exact baseline build and arithmetic dispatch
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          {
            echo "=== BASELINE BINARY ==="
            sha256sum target/challenge-candidate/challenge/flock-benchmark-worker
            file target/challenge-candidate/challenge/flock-benchmark-worker
            echo "=== BUILD CONFIG ==="
            env | grep -E '^(RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|RUSTC_WRAPPER|CARGO_BUILD_TARGET|RAYON_NUM_THREADS|FLOCK_)=' | sort || true
            echo "=== CPU FLAGS ==="
            lscpu | grep -E 'Model name|Flags|Architecture|Vendor ID'
            echo "=== FEATURE DISPATCH SITES ==="
            grep -RIn --include='*.rs' -E 'is_x86_feature_detected!|target_feature|cfg!\\(target_feature|mulx|adx|avx512|avx2|pclmul' crates/flock-core crates/flock-prover | head -160 || true
            echo "=== SETUP BUILD COMMANDS ==="
            grep -nE 'RUSTFLAGS|target-cpu|cargo .*build|flock-benchmark-worker' setup.sh || true
          } > "$GITHUB_WORKSPACE/snark-baseline-build-audit.txt"
          echo "Baseline build and dispatch audit captured."

      - name: Capture Zerocheck source before verification
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          source_file="crates/flock-core/src/zerocheck.rs"
          echo "=== ZEROCHECK SOURCE FINGERPRINT ==="
          sha256sum "$source_file"
          echo "=== LOOKAHEAD SELECTOR AND NEARBY SOURCE ==="
          grep -n -C 28 'FLOCK_NO_ZC_LOOKAHEAD' "$source_file" | head -190 || true
          echo "=== SOURCE HOT-PATH REFERENCES ==="
          grep -nE 'lookahead|Lookahead|with_capacity|collect\\(|clone\\(|par_iter|par_chunks|Mutex|RwLock' "$source_file" | head -120 || true
          cp "$source_file" "$GITHUB_WORKSPACE/snark-zerocheck-source.rs"
          echo "ZEROCHECK_SOURCE_CAPTURED"
      - name: Preflight trusted-baseline validity
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          cp benchmark-tools/harness/src/main.rs /tmp/flock-preflight-harness-main.rs
          trap 'cp /tmp/flock-preflight-harness-main.rs benchmark-tools/harness/src/main.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path("benchmark-tools/harness/src/main.rs")
          s=p.read_text()
          old='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          new='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              if let Ok(value) = std::env::var("FLOCK_DIAG_SEED") {
                  let seed: u64 = value.parse()?;
                  eprintln!("HARNESS_EFFECTIVE_SEED={seed}");
                  return Ok(seed);
              }
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          if old not in s: raise SystemExit("fresh_seed source mismatch")
          p.write_text(s.replace(old,new,1))
          PY
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/preflight-harness -p flock-benchmark-harness
          echo "=== VERIFY HARNESS SEED CONTROL ==="
          grep -n -C 5 'fresh_seed()' benchmark-tools/harness/src/main.rs
          if ! grep -q 'FLOCK_DIAG_SEED' benchmark-tools/harness/src/main.rs; then
            echo "::error::Harness ignores FLOCK_DIAG_SEED; deterministic benchmark claims are invalid. Stop before expensive proofs."
            exit 87
          fi
          HARNESS="$PWD/target/preflight-harness/challenge/flock_benchmark_harness"
          BASE="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
          test -x "$HARNESS"; test -x "$BASE"
          : > "$GITHUB_WORKSPACE/snark-preflight.log"
          pass=0
          for attempt in 1 2 3; do
            scratch="$PWD/benchmark-results/preflight-$attempt"
            rm -rf "$scratch"
            mkdir -p "$scratch"
            rm -f score.json
            echo "=== PREFLIGHT attempt=$attempt/3 baseline seed=0 threads=1 ===" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            set +e
            FLOCK_DIAG_SEED=0 "$HARNESS" "$BASE" "$scratch" "$PWD/score.json" \
              "$PWD/benchmark-results/preflight-$attempt.md" 18 1 0 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ] && python3 - <<'PY'
          import json
          d=json.load(open("score.json"))
          assert isinstance(d.get("score"),(int,float)) and d["score"] > 0
          PY
            then
              pass=$((pass+1))
              echo "PREFLIGHT_ATTEMPT_PASS attempt=$attempt" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            else
              echo "PREFLIGHT_ATTEMPT_FAIL attempt=$attempt rc=$rc" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
              echo "PREFLIGHT_SUMMARY passes=$pass/$attempt (early stop)" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
              echo "::error::Trusted baseline verification failed at attempt $attempt; aborting before further costly proofs or candidate build."
              exit 86
            fi
          done
          echo "PREFLIGHT_SUMMARY passes=$pass/3" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
          if [ "$pass" -lt 3 ]; then
            echo "::error::Trusted baseline is not deterministic on this hosted runner ($pass/3 valid). Candidate was not built or measured."
            exit 86
          fi
          seed_lines="$(grep -c 'HARNESS_EFFECTIVE_SEED=0' "$GITHUB_WORKSPACE/snark-preflight.log" || true)"
          if [ "$seed_lines" -ne 3 ]; then
            echo "::error::Expected three explicit seed=0 confirmations, found $seed_lines."
            exit 87
          fi
          echo "PREFLIGHT_PASS trusted baseline verified 3/3" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"

      - name: Reliable single-thread paired A/B gate
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          cp benchmark-tools/harness/src/main.rs /tmp/flock-harness-main.rs
          trap 'cp /tmp/flock-harness-main.rs benchmark-tools/harness/src/main.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path("benchmark-tools/harness/src/main.rs")
          s=p.read_text()
          old='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          new='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              if let Ok(value) = std::env::var("FLOCK_DIAG_SEED") {
                  let seed: u64 = value.parse()?;
                  eprintln!("HARNESS_EFFECTIVE_SEED={seed}");
                  return Ok(seed);
              }
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          if old not in s: raise SystemExit("fresh_seed source mismatch")
          p.write_text(s.replace(old,new,1))
          PY
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/seed-diagnostic -p flock-benchmark-harness
          HARNESS="$PWD/target/seed-diagnostic/challenge/flock_benchmark_harness"
          # Use the exact worker produced by the challenge setup as the baseline.
          # Rebuilding it with a different RUSTFLAGS target changes the binary and has
          # already produced verifier-invalid proofs on some hosted runners.
          BASE="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
          test -x "$HARNESS"; test -x "$BASE"
          sha256sum "$BASE" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          seeds="0 1 54324593501110620 9223372036854775807 9223372036854775808 18446744073709551615"
          threads=1
          rm -rf benchmark-results/ab
          mkdir -p benchmark-results/ab
          : > "$GITHUB_WORKSPACE/snark-ab.log"
          : > "$GITHUB_WORKSPACE/snark-ab.tsv"

          echo "=== PROFILE-ONLY BASELINE: no optimization candidate selected ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          echo "Profiling six trusted baseline seeds with proof verification; no performance improvement will be claimed." | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          for seed in $seeds; do
            scratch="$PWD/benchmark-results/ab/baseline-$seed"
            rm -rf "$scratch"; mkdir -p "$scratch"; rm -f score.json
            echo "=== baseline seed=$seed ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            FLOCK_ZC_TIMING=1 FLOCK_DIAG_SEED="$seed" /usr/bin/time -v "$HARNESS" "$BASE" "$scratch" "$PWD/score.json" \
              "$PWD/benchmark-results/ab/baseline-$seed.md" 18 "$threads" 0 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            python3 - "$seed" "$GITHUB_WORKSPACE/snark-ab.tsv" <<'PY'
          import json,sys
          seed,out=sys.argv[1:]
          d=json.load(open("score.json"))
          score=d.get("score")
          if not isinstance(score,(int,float)) or score <= 0:
              raise SystemExit("invalid verified baseline score")
          with open(out,"a") as f: f.write(f"baseline\t{seed}\t{score}\n")
          PY
          done
          python3 - "$GITHUB_WORKSPACE/snark-ab.log" "$GITHUB_WORKSPACE/snark-baseline-profile-summary.txt" <<'PY'
          import re,statistics,sys
          log=open(sys.argv[1]).read()
          scores=[float(x) for x in re.findall(r'^measured_trial=1/1 trial_score=([0-9.]+).*verified=true',log,re.M)]
          rss=[int(x) for x in re.findall(r'Maximum resident set size \(kbytes\): (\d+)',log)]
          wall=[x for x in re.findall(r'Elapsed \(wall clock\) time \(h:mm:ss or m:ss\): (\S+)',log)]
          if len(scores)!=6 or len(rss)!=6 or len(wall)!=6:
              raise SystemExit(f"incomplete profile: scores={len(scores)} rss={len(rss)} wall={len(wall)}")
          with open(sys.argv[2],"w") as f:
              f.write(f"baseline_trials=6 verified=6 median_score={statistics.median(scores):.3f}\n")
              f.write(f"median_peak_rss_mib={statistics.median(rss)/1024:.1f}\n")
              f.write(f"elapsed_wall_samples={','.join(wall)}\n")
              f.write("No candidate measured. These are process-level measurements, not prover phase attribution.\n")
          print(open(sys.argv[2]).read())
          PY
          # The trusted BASE is a prebuilt worker; its timing code may be
          # compiled out. Preserve it unchanged and record the reason before
          # attempting further baseline-only profiling.
          echo "=== ZEROCHECK TIMING ACTIVATION AUDIT ===" > "$GITHUB_WORKSPACE/snark-zc-timing-audit.txt"
          {
            echo "=== source context ==="
            rg -n -C 22 --fixed-strings '[zc-timing]' crates/ || true
            echo "=== source gating ==="
            rg -n -C 4 'FLOCK_ZC_TIMING|cfg\\(debug_assertions\\)|cfg\\(feature|zc.timing' crates/flock-core/src crates/flock-prover/src || true
            echo "=== baseline worker identity ==="
            sha256sum "$BASE"
            file "$BASE"
            echo "=== embedded timing marker ==="
            if grep -aFq '[zc-timing]' "$BASE"; then
              echo "TIMING_MARKER_EMBEDDED=yes"
            else
              echo "TIMING_MARKER_EMBEDDED=no"
            fi
          } >> "$GITHUB_WORKSPACE/snark-zc-timing-audit.txt"
          echo "=== ZEROCHECK PHASE TIMINGS (diagnostic only) ===" | tee "$GITHUB_WORKSPACE/snark-zc-phase-timings.txt"
          grep -F '[zc-timing]' "$GITHUB_WORKSPACE/snark-ab.log" | tee -a "$GITHUB_WORKSPACE/snark-zc-phase-timings.txt" || true
          if ! grep -Fq '[zc-timing]' "$GITHUB_WORKSPACE/snark-zc-phase-timings.txt"; then
            echo "::notice::No Zerocheck phase timings emitted by baseline worker; diagnostic unavailable."
          fi
          echo "PROFILE_ONLY_COMPLETE: 6 verified baseline trials; no candidate measured; Yukon submission disabled." | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
      - name: Capture Zerocheck diagnostic source and CPU dispatch
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/snark-timing-hooks.txt"
          {
            echo "SOURCE_DIAGNOSTICS_ONLY; no optimization candidate measured"
            echo "=== CPU architecture and features ==="
            lscpu
            echo "=== Zerocheck timing references ==="
            rg -n -C 6 --fixed-strings '[zc-timing]' crates/ || true
            echo "=== Zerocheck verifier final check ==="
            sed -n '1300,1360p' crates/flock-core/src/zerocheck.rs
            echo "=== Arithmetic dispatch and target features ==="
            rg -n -m 30 'target_feature|is_x86_feature_detected|target-cpu|avx2|avx512|pclmulqdq' crates/flock-core/src crates/flock-prover/src || true
          } > "$out"
          echo "Diagnostics only; proof gate and Yukon lock unchanged." >> "$out"

      - name: Require explicit Yukon release
        if: ${{ inputs.submit != true }}
        run: |
          echo "Local benchmark completed. Yukon submission withheld by default."
      - name: Submit to Yukon
        if: ${{ false }}
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submit --track x86 --note-file "$GITHUB_WORKSPACE/snark-x86-note.md" --model "GPT-5.6 Sol" --harness "ChatGPT" 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-submit.log"
      - name: Query status
        if: always()
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-after.json" || true
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-submit-receipt
          path: |
            snark-candidate.diff
            snark-before.json
            yukon-snark-submit.log
            snark-local-score.txt
            snark-local-gain.txt
            snark-single-thread-score.json
            snark-four-thread-score.json
            snark-single-thread.log
            snark-four-thread.log
            snark-preflight.log
            snark-ab.log
            snark-ab.tsv
            snark-baseline-profile-summary.txt
            snark-timing-hooks.txt
            snark-zc-phase-timings.txt
            snark-zc-timing-audit.txt
            snark-runner-env.txt
            snark-proof-source-inspection.txt
            snark-baseline-build-audit.txt
            snark-lookahead-source.txt
            snark-zerocheck-source.rs
            snark-divergence.log
            snark-setup-baseline.sha256
            snark-crossenv-env.txt
            snark-crossenv-sha256.txt
            snark-crossenv-files.txt
            snark-proof-chunks.sha256
            seed0.proof
            snark-crossenv-capture/**
            yukon-snark-after.json
          if-no-files-found: ignore
