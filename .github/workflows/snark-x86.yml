name: SNARK.fast x86 candidate benchmark
on:
  workflow_dispatch:
    inputs:
      analysis_only:
        description: "Run source analysis without costly proof benchmark"
        required: true
        default: true
        type: boolean
      proof_smoke:
        description: "Run optional host-dependent candidate proof smoke test"
        required: true
        default: false
        type: boolean
      kernel_reduce_candidate:
        description: "Use identity-free packed AB reduction candidate in paired A/B"
        required: true
        default: false
        type: boolean
      paired_ab:
        description: "Run six-seed paired trusted A/B test of round-one scheduling candidate"
        required: true
        default: false
        type: boolean
      submit:
        description: "Submit candidate to Yukon after benchmark gate passes"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  source-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon CLI
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clone challenge source for independent analysis
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Inspect candidate hot paths without running proofs
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/snark-source-analysis.txt"
          {
            echo "SOURCE_ANALYSIS_ONLY; no benchmark or optimization claim"
            echo "=== challenge revision ==="
            git rev-parse HEAD
            echo "=== Zerocheck round timing and fold context ==="
            grep -nE -C 15 'zc-timing|FLOCK_ZC_TIMING|identity.C|fold|round1' crates/flock-core/src/zerocheck.rs | head -n 300 || true
            echo "=== Worker process invocation ==="
            grep -nE -C 8 'Command|spawn|env|stdout|stderr|wait|output' benchmark-tools/harness/src/main.rs benchmark-tools/worker/src/main.rs | head -n 220 || true
            echo "=== Worker isolation: environment and output suppression ==="
            sed -n '148,170p' benchmark-tools/harness/src/main.rs
            echo "=== Zerocheck prover timing guards and surrounding loops ==="
            sed -n '450,850p' crates/flock-core/src/zerocheck.rs
            echo "=== Optimization candidates are NOT enabled ==="
          } > "$out"
      - name: Prepare isolated round-one scheduling candidate
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("crates/flock-core/src/zerocheck.rs")
          s=p.read_text()
          import re
          pattern=r'match\s+crate::smt_split::zc_r1_pools\(\)\s*\{.*?None\s*=>\s*rayon::join\(ab_closure,\s*c_closure\),?\s*\}'
          matches=list(re.finditer(pattern,s,re.S))
          if len(matches)!=1:
              raise SystemExit(f"Expected exactly one scheduling block; found {len(matches)}")
          patched=s[:matches[0].start()]+'rayon::join(ab_closure, c_closure)'+s[matches[0].end():]
          p.write_text(patched)
          PY
          git diff --check
          git diff -- crates/flock-core/src/zerocheck.rs > "$GITHUB_WORKSPACE/snark-round1-scheduling-candidate.patch"
          test -s "$GITHUB_WORKSPACE/snark-round1-scheduling-candidate.patch"
          echo "CANDIDATE_PREPARED_ONLY: use rayon::join for AB/C round-one scheduling; no correctness or performance claim." > "$GITHUB_WORKSPACE/snark-candidate-status.txt"
          git checkout -- crates/flock-core/src/zerocheck.rs
      - name: Compile isolated candidate without running proofs
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          status="$GITHUB_WORKSPACE/snark-candidate-compile-status.txt"
          echo "CANDIDATE_COMPILE_STARTED; no proof or performance claims" > "$status"
          ./setup.sh
          git apply --check "$GITHUB_WORKSPACE/snark-round1-scheduling-candidate.patch"
          git apply "$GITHUB_WORKSPACE/snark-round1-scheduling-candidate.patch"
          trap 'git apply -R "$GITHUB_WORKSPACE/snark-round1-scheduling-candidate.patch" || true' EXIT
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/round1-scheduling-candidate \
            -p flock-benchmark-worker
          candidate="$PWD/target/round1-scheduling-candidate/challenge/flock-benchmark-worker"
          test -x "$candidate"
          sha256sum "$candidate" >> "$status"
          echo "CANDIDATE_COMPILE_PASS; proof verification and speed untested" >> "$status"
      - name: Candidate trusted proof smoke test
        if: ${{ inputs.proof_smoke }}
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          status="$GITHUB_WORKSPACE/snark-candidate-proof-status.txt"
          echo "CANDIDATE_PROOF_STARTED; no throughput claim" > "$status"
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/round1-proof-harness \
            -p flock-benchmark-harness
          harness="$PWD/target/round1-proof-harness/challenge/flock_benchmark_harness"
          candidate="$PWD/target/round1-scheduling-candidate/challenge/flock-benchmark-worker"
          test -x "$harness"; test -x "$candidate"
          mkdir -p benchmark-results/round1-proof-smoke
          set +e
          "$harness" "$candidate" "$PWD/benchmark-results/round1-proof-smoke" \
            "$PWD/score.json" "$PWD/benchmark-results/round1-proof-smoke.md" \
            18 1 0 1 > "$GITHUB_WORKSPACE/snark-candidate-proof.log" 2>&1
          rc=$?
          set -e
          echo "HARNESS_EXIT_CODE=$rc" >> "$status"
          if [ "$rc" -ne 0 ]; then
            echo "CANDIDATE_PROOF_FAIL" >> "$status"
            tail -n 70 "$GITHUB_WORKSPACE/snark-candidate-proof.log"
            exit "$rc"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("score.json")
          assert p.is_file(), "missing trusted harness score"
          d=json.loads(p.read_text())
          assert isinstance(d.get("score"),(int,float)) and d["score"]>0, "invalid trusted score"
          PY
          echo "CANDIDATE_PROOF_PASS: trusted harness returned a positive score; performance untested" >> "$status"
      - name: Upload candidate proof smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-round1-proof-smoke
          path: |
            snark-candidate-proof-status.txt
            snark-candidate-proof.log
          if-no-files-found: warn
      - name: Upload candidate compile status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-round1-compile-status
          path: snark-candidate-compile-status.txt
          if-no-files-found: warn
      - name: Upload isolated candidate patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-round1-scheduling-candidate
          path: |
            snark-round1-scheduling-candidate.patch
            snark-candidate-status.txt
          if-no-files-found: warn
      - name: Capture inner-loop optimization evidence
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("crates/flock-core/src/zerocheck.rs")
          src=p.read_text().splitlines()
          out=Path(__import__("os").environ["GITHUB_WORKSPACE"])/"snark-inner-loop-analysis.txt"
          patterns={
            "round-one AB / C":r"ab_closure|c_closure|round1|round_1",
            "field arithmetic":r"mul_assign|add_assign|\*=|\+=|mul_add|square\(",
            "allocations / copies":r"collect\(|to_vec\(|Vec::|with_capacity|clone\(|copy_from_slice|reserve\(",
            "parallel scheduling":r"par_iter|rayon|smt_split|join\(",
          }
          with out.open("w") as f:
            f.write("SOURCE_ONLY; prior direct rayon::join candidate REJECTED (-0.7513% median, 3/6 wins).\n")
            f.write("No candidate modification, proof execution, or performance claim.\n")
            for label,pattern in patterns.items():
              matches=[i for i,line in enumerate(src) if re.search(pattern,line)]
              f.write(f"\n=== {label}: {len(matches)} matching lines ===\n")
              for i in matches[:65]:
                lo=max(0,i-7);hi=min(len(src),i+9)
                f.write(f"--- lines {lo+1}-{hi} ---\n")
                for j in range(lo,hi):
                  f.write(f"{j+1:5d} {src[j]}\n")
          PY
      - name: Inspect actual packed round-one kernels
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path("crates/flock-core/src")
          out=Path(os.environ["GITHUB_WORKSPACE"])/"snark-packed-kernel-analysis.txt"
          names=(
            "round1_shift_reduce_ab_packed_padded_with_precomputed",
            "round1_shift_reduce_extract_c_packed_padded_with_precomputed_ab_fold4",
            "round1_shift_reduce_extract_c_packed_padded_with_precomputed_ab_quad",
            "round1_shift_reduce_extract_c_packed_padded_with_s_hat_v_quad",
          )
          sources=list(root.rglob("*.rs"))
          with out.open("w") as f:
            f.write("PACKED_KERNEL_SOURCE_INSPECTION_ONLY; no modification or performance claim.\n")
            for name in names:
              hits=[]
              for path in sources:
                lines=path.read_text().splitlines()
                for i,line in enumerate(lines):
                  if re.search(r"\b(?:pub(?:\([^)]*\))?\s+)?fn\s+"+re.escape(name)+r"\b",line):
                    hits.append((path,i,lines))
              f.write(f"\n=== {name}: {len(hits)} definitions ===\n")
              for path,i,lines in hits:
                f.write(f"FILE {path} LINE {i+1}\n")
                for j in range(max(0,i-8),min(len(lines),i+190)):
                  f.write(f"{j+1:5d} {lines[j]}\n")
            f.write("\nNo kernel optimization has been selected or enabled.\n")
          PY
      - name: Capture full AB kernel and allocation consumers
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path("crates/flock-core/src/zerocheck/univariate_skip_optimized.rs")
          lines=p.read_text().splitlines()
          out=Path(os.environ["GITHUB_WORKSPACE"])/"snark-ab-kernel-full.txt"
          start=next(i for i,line in enumerate(lines) if "pub fn round1_shift_reduce_ab_packed_padded_with_precomputed(" in line)
          end=min(len(lines),start+1050)
          with out.open("w") as f:
            f.write(f"Source: {p}; lines {start+1}-{end}; inspection only, no performance claim.\n")
            for i in range(start,end):
              f.write(f"{i+1:5d} {lines[i]}\n")
            f.write("\n=== All b_med_counts_live uses in source ===\n")
            for i,line in enumerate(lines):
              if "b_med_counts_live" in line:
                f.write(f"{i+1:5d} {line}\n")
          PY
      - name: Upload full AB kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-full-ab-kernel
          path: snark-ab-kernel-full.txt
          if-no-files-found: error
      - name: Upload packed-kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-packed-kernel-analysis
          path: snark-packed-kernel-analysis.txt
          if-no-files-found: error
      - name: Upload inner-loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-inner-loop-analysis
          path: snark-inner-loop-analysis.txt
          if-no-files-found: warn
      - name: Upload independent source analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-source-analysis
          path: snark-source-analysis.txt
          if-no-files-found: warn

  paired-ab:
    if: ${{ inputs.paired_ab }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight benchmark CPU before expensive setup
        run: |
          set -euo pipefail
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "PAIRED_AB_HOST_MODEL=$model"
          if [[ "$model" == *"EPYC 7763"* || "$model" == *"EPYC 9V74"* ]]; then
            echo "::notice::HOST_QUARANTINED: $model; no candidate measured. Runner selection is outside workflow control."
            exit 86
          fi
      - name: Install Yukon CLI
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clone and build trusted baseline
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
          cd "$ROOT"
          ./setup.sh
      - name: Verify host and build candidate
        env:
          KERNEL_REDUCE_CANDIDATE: ${{ inputs.kernel_reduce_candidate }}
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "HOST_MODEL=$model"
          if [[ "$model" == *"EPYC 7763"* || "$model" == *"EPYC 9V74"* ]]; then
            echo "::notice::HOST_QUARANTINED: $model; no performance result."
            exit 86
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os
          if os.environ.get("KERNEL_REDUCE_CANDIDATE")=="true":
              p=Path("crates/flock-core/src/zerocheck/univariate_skip_optimized.rs")
              s=p.read_text()
              # Match the reduction directly: function names may change upstream.
              # Require exactly one occurrence to avoid patching unrelated code.
              block=s
              old='''.map(|s| s.local_res_ab)
            .reduce(
            || [F128::ZERO; ELL],
            |mut ab1, ab2| {
                for i in 0..ELL {
                    ab1[i] += ab2[i];
                }
                ab1
            },
            );'''
              new='''.map(|s| s.local_res_ab)
            .reduce_with(|mut ab1, ab2| {
            for i in 0..ELL {
                ab1[i] += ab2[i];
            }
            ab1
            })
            .unwrap_or([F128::ZERO; ELL]);'''
              if block.count(old)!=1: raise SystemExit(f"packed AB reduction anchor mismatch: found {block.count(old)} occurrences")
              p.write_text(s.replace(old,new,1))
              print("KERNEL_REDUCE_CANDIDATE_APPLIED")
          else:
              p=Path("crates/flock-core/src/zerocheck.rs")
              s=p.read_text()
              pattern=r'match\\s+crate::smt_split::zc_r1_pools\\(\\)\\s*\\{.*?None\\s*=>\\s*rayon::join\\(ab_closure,\\s*c_closure\\),?\\s*\\}'
              matches=list(re.finditer(pattern,s,re.S))
              if len(matches)!=1: raise SystemExit(f"expected one scheduling block, got {len(matches)}")
              p.write_text(s[:matches[0].start()]+'rayon::join(ab_closure, c_closure)'+s[matches[0].end():])
          PY
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --target-dir target/round1-ab-candidate -p flock-benchmark-worker
          git checkout -- crates/flock-core/src/zerocheck.rs crates/flock-core/src/zerocheck/univariate_skip_optimized.rs
          test -x target/round1-ab-candidate/challenge/flock-benchmark-worker
          test -x target/challenge-candidate/challenge/flock-benchmark-worker
      - name: Run six paired verified trials
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          cp benchmark-tools/harness/src/main.rs /tmp/round1-ab-harness.rs
          trap 'cp /tmp/round1-ab-harness.rs benchmark-tools/harness/src/main.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path("benchmark-tools/harness/src/main.rs")
          s=p.read_text()
          old='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          new='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              if let Ok(v) = std::env::var("FLOCK_DIAG_SEED") {
                  let seed: u64 = v.parse()?;
                  eprintln!("HARNESS_EFFECTIVE_SEED={seed}");
                  return Ok(seed);
              }
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          if s.count(old)!=1: raise SystemExit("seed harness source mismatch")
          p.write_text(s.replace(old,new,1))
          PY
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --target-dir target/round1-ab-harness -p flock-benchmark-harness
          HARNESS="$PWD/target/round1-ab-harness/challenge/flock_benchmark_harness"
          BASE="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
          CAND="$PWD/target/round1-ab-candidate/challenge/flock-benchmark-worker"
          mkdir -p benchmark-results/round1-ab
          : > "$GITHUB_WORKSPACE/snark-round1-ab.tsv"
          for seed in 0 1 54324593501110620 9223372036854775807 9223372036854775808 18446744073709551615; do
            for variant in baseline candidate; do
              if [[ "$variant" == baseline ]]; then worker="$BASE"; else worker="$CAND"; fi
              scratch="$PWD/benchmark-results/round1-ab/$variant-$seed"
              mkdir -p "$scratch"
              rm -f score.json
              FLOCK_DIAG_SEED="$seed" "$HARNESS" "$worker" "$scratch" "$PWD/score.json" \
                "$PWD/benchmark-results/round1-ab/$variant-$seed.md" 18 1 0 1 \
                > "$GITHUB_WORKSPACE/snark-round1-$variant-$seed.log" 2>&1
              python3 - "$variant" "$seed" "$GITHUB_WORKSPACE/snark-round1-ab.tsv" <<'PY'
          import json,sys
          variant,seed,path=sys.argv[1:]
          d=json.load(open("score.json"))
          score=d.get("score")
          assert isinstance(score,(int,float)) and score>0, "trusted verification score missing"
          with open(path,"a") as f:f.write(f"{variant}\t{seed}\t{score}\n")
          PY
            done
          done
          python3 - <<'PY'
          import csv,statistics
          rows=list(csv.reader(open("/dev/null")))
          import os
          path=os.environ["GITHUB_WORKSPACE"]+"/snark-round1-ab.tsv"
          scores={}
          for variant,seed,score in csv.reader(open(path),delimiter="\t"):
              scores[(variant,seed)]=float(score)
          seeds=[s for (v,s) in scores if v=="baseline"]
          assert len(seeds)==6 and len(scores)==12
          gains=[100*(scores[("candidate",s)]/scores[("baseline",s)]-1) for s in seeds]
          wins=sum(g>0 for g in gains)
          median=statistics.median(gains)
          result=f"paired_seeds=6 verified_trials=12 wins={wins}/6 median_paired_gain_pct={median:.4f}\n"
          result+=f"ACCEPTED={median>=2 and wins>=5}\n"
          open(os.environ["GITHUB_WORKSPACE"]+"/snark-round1-ab-summary.txt","w").write(result)
          print(result)
          PY
      - name: Upload paired benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-round1-paired-ab
          path: |
            snark-round1-ab.tsv
            snark-round1-ab-summary.txt
            snark-round1-*.log
          if-no-files-found: warn
  snark-submit:
    if: ${{ !inputs.analysis_only && !inputs.paired_ab }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon CLI
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -n "${YUKON_API_TOKEN:-}"
      - name: Clone linked x86 worktree
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Confirm Yukon linkage
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json > "$GITHUB_WORKSPACE/snark-before.json"
      - name: Record runner environment
        run: |
          set -euo pipefail
          echo "ImageOS=${ImageOS:-unknown}" | tee "$GITHUB_WORKSPACE/snark-runner-env.txt"
          echo "ImageVersion=${ImageVersion:-unknown}" | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"
          uname -a | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"
          lscpu | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"

      - name: Prepare benchmark dependencies
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          ./setup.sh

      - name: Audit trusted worker timing support before CPU gate
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/snark-zc-timing-audit.txt"
          {
            echo "TIMING_AUDIT_BEFORE_CPU_GATE; no proof or candidate measured"
            echo "=== Zerocheck timing source and guards ==="
            rg -n -C 15 --fixed-strings '[zc-timing]' crates/ benchmark-tools/ || true
            rg -n -C 3 'FLOCK_ZC_TIMING|cfg\\(debug_assertions\\)|cfg\\(feature' crates/ benchmark-tools/ || true
            echo "=== Worker embedded timing marker context ==="
            base="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
            if [[ -f "$base" ]]; then
              strings "$base" | grep -i -E -m 20 'zc-timing|FLOCK_.*TIM|timing' || true
            else
              echo "WORKER_NOT_BUILT_AT_AUDIT_TIME"
            fi
            echo "=== Trusted baseline worker ==="
            base="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
            if [[ -f "$base" ]]; then
              sha256sum "$base"
              if grep -aFq '[zc-timing]' "$base"; then
                echo "TIMING_MARKER_EMBEDDED=yes"
              else
                echo "TIMING_MARKER_EMBEDDED=no"
              fi
            else
              echo "TIMING_MARKER_EMBEDDED=unknown; worker not yet built"
            fi
          } > "$out"
          echo "Timing audit recorded independently of trusted-proof host gate."
          
      - name: Locate actual timing and worker-spawn source before CPU gate
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/snark-worker-env-audit.txt"
          {
            echo "=== Repository root and relevant source files ==="
            pwd
            find . -type f \( -name 'zerocheck.rs' -o -name 'main.rs' -o -name '*harness*.rs' \) -not -path '*/target/*' | head -n 100
            echo "=== All Rust source references (include hidden/ignored paths) ==="
            rg -uuu -n -g '*.rs' -g '!**/target/**' -g '!**/.git/**' -m 4 'FLOCK_ZC_TIMING|\\[zc-timing\\]|Command::new|env_clear\\(' . | head -n 180 || true
            echo "=== Exact harness and worker process wiring ==="
            grep -nE -C 5 'Command|spawn|env|stdout|stderr|wait|output' benchmark-tools/harness/src/main.rs benchmark-tools/worker/src/main.rs | head -n 220 || true
            echo "=== Exact Zerocheck timing activation ==="
            grep -nE -C 12 'zc-timing|FLOCK_ZC_TIMING|Instant::now' crates/flock-core/src/zerocheck.rs | head -n 220 || true
            echo "=== Worker spawn in benchmark harness ==="
            rg -n -C 8 'Command::new|env_clear|Stdio|spawn' benchmark-tools/harness/src || true
            echo "=== Source code provenance ==="
            git rev-parse HEAD || true
            git status --short || true
            echo "=== Timing environment on diagnostic step ==="
            echo "FLOCK_ZC_TIMING=${FLOCK_ZC_TIMING:-unset}; benchmark sets it per harness invocation"
          } > "$out"
      - name: Capture reproducibility fingerprints before proof gate
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/snark-repro-fingerprint.txt"
          {
            echo "=== CPU and microcode ==="
            lscpu | grep -E 'Model name|Architecture|Flags|Hypervisor vendor|Virtualization' || true
            grep -m1 -E '^microcode|^cpu family|^model[[:space:]]|^stepping' /proc/cpuinfo || true
            echo "=== Toolchain ==="
            rustc +1.97.0 -Vv || true
            echo "=== Source revision ==="
            git rev-parse HEAD || true
            echo "=== Worker binary and setup outputs ==="
            find target -type f -name 'flock-benchmark-worker' -print -exec sha256sum {} \; || true
            echo "=== Build feature controls ==="
            printenv | grep -E '^(RUSTFLAGS|CARGO_BUILD_TARGET|RUSTC_WRAPPER|RUSTUP_TOOLCHAIN|FLOCK_)=' || true
            echo "=== Host and kernel ==="
            uname -a
          } > "$out"
      - name: Record x86 host class
        run: |
          set -euo pipefail
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Benchmark host: $model"
          # EPYC 7763 repeatedly rejects the unchanged trusted baseline at
          # Zerocheck(SumcheckFinalFailed). Skip before costly builds; do not
          # treat this infrastructure skip as proof or performance success.
          if [[ "$model" == *"EPYC 7763"* ]]; then
            echo "::notice::HOST_SKIP_KNOWN_BASELINE_FAILURE: AMD EPYC 7763; trusted baseline historically fails; no candidate measured."
            exit 86
          fi
          # EPYC 9V74 is intermittently incorrect on the unchanged trusted
          # baseline (passing #115, failing #119 and #120). Until the root
          # cause is resolved, skip costly proof runs but retain the preceding
          # reproducibility fingerprints and source audits as artifacts.
          if [[ "$model" == *"EPYC 9V74"* ]]; then
            echo "::notice::HOST_SKIP_INTERMITTENT_BASELINE_FAILURE: AMD EPYC 9V74; passing and failing trusted proofs observed; no candidate measured."
            exit 86
          fi
          # EPYC 9V74 has both passing (#105) and failing (#109) baseline
          # results. Do not blacklist the model; flag intermittent correctness.
          if [[ "$model" == *"EPYC 9V74"* ]]; then
            echo "::notice::HOST_INTERMITTENT_BASELINE_FAILURE: AMD EPYC 9V74; strict 3/3 preflight required; a failed proof is never retried as a pass."
          fi
          # All other hosts still require strict trusted 3/3 proof preflight.
          # CPU identification alone never counts as a correctness pass.
          case "$model" in
            *"XEON"*"8573C"*|*"Xeon"*"8573C"*)
              echo "HOST_CLASS=known-valid-reference"
              ;;
            *)
              echo "HOST_CLASS=unclassified; requiring strict 3/3 trusted preflight"
              ;;
          esac

      - name: Capture prover nondeterminism diagnostics
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          echo "=== SOURCE REVISION ===" | tee "$GITHUB_WORKSPACE/snark-divergence.log"
          git rev-parse HEAD | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          echo "=== OPTIMIZATION SELECTORS ===" | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          grep -RIn --include='*.rs' -E 'FLOCK_NO_|target_feature|is_x86_feature_detected|par_iter|into_par_iter|rayon' crates/flock-core crates/flock-prover 2>/dev/null \
            | tee -a "$GITHUB_WORKSPACE/snark-divergence.log" || true
          echo "=== ZEROCHECK / SUMCHECK CALL SITES ===" | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          grep -RIn --include='*.rs' -E 'zerocheck|Zerocheck|sumcheck|Sumcheck' crates 2>/dev/null \
            | tee -a "$GITHUB_WORKSPACE/snark-divergence.log" || true
          echo "=== CPU FEATURE ENVIRONMENT ===" | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          lscpu | grep -E 'Model name|Flags' | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"
          rustc +1.97.0 -vV | tee -a "$GITHUB_WORKSPACE/snark-divergence.log"

      - name: Inspect proof serialization and verifier source
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          {
            echo "=== PROOF SERIALIZATION ==="
            sed -n '145,215p' crates/flock-prover/src/proof_io.rs
            sed -n '385,435p' crates/flock-prover/src/proof_io.rs
            echo "=== ZEROCHECK VERIFICATION ==="
            sed -n '120,205p' crates/flock-core/src/verifier.rs
            echo "=== ZEROCHECK SUMCHECK FAILURE SITES ==="
            grep -RIn -C 6 'SumcheckFinalFailed' crates/flock-core/src
            echo "=== PROOF WRITER CALL SITES ==="
            grep -RIn -C 3 'write_proof\|serialize_proof\|proof_io::' crates/flock-prover/src benchmark-tools 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/snark-proof-source-inspection.txt"
          echo "Proof serialization/verifier source captured in artifact."

      - name: Record exact baseline build and arithmetic dispatch
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          {
            echo "=== BASELINE BINARY ==="
            sha256sum target/challenge-candidate/challenge/flock-benchmark-worker
            file target/challenge-candidate/challenge/flock-benchmark-worker
            echo "=== BUILD CONFIG ==="
            env | grep -E '^(RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|RUSTC_WRAPPER|CARGO_BUILD_TARGET|RAYON_NUM_THREADS|FLOCK_)=' | sort || true
            echo "=== CPU FLAGS ==="
            lscpu | grep -E 'Model name|Flags|Architecture|Vendor ID'
            echo "=== FEATURE DISPATCH SITES ==="
            grep -RIn --include='*.rs' -E 'is_x86_feature_detected!|target_feature|cfg!\\(target_feature|mulx|adx|avx512|avx2|pclmul' crates/flock-core crates/flock-prover | head -160 || true
            echo "=== SETUP BUILD COMMANDS ==="
            grep -nE 'RUSTFLAGS|target-cpu|cargo .*build|flock-benchmark-worker' setup.sh || true
          } > "$GITHUB_WORKSPACE/snark-baseline-build-audit.txt"
          echo "Baseline build and dispatch audit captured."

      - name: Capture Zerocheck source before verification
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          source_file="crates/flock-core/src/zerocheck.rs"
          echo "=== ZEROCHECK SOURCE FINGERPRINT ==="
          sha256sum "$source_file"
          echo "=== LOOKAHEAD SELECTOR AND NEARBY SOURCE ==="
          grep -n -C 28 'FLOCK_NO_ZC_LOOKAHEAD' "$source_file" | head -190 || true
          echo "=== SOURCE HOT-PATH REFERENCES ==="
          grep -nE 'lookahead|Lookahead|with_capacity|collect\\(|clone\\(|par_iter|par_chunks|Mutex|RwLock' "$source_file" | head -120 || true
          cp "$source_file" "$GITHUB_WORKSPACE/snark-zerocheck-source.rs"
          echo "ZEROCHECK_SOURCE_CAPTURED"
      - name: Preflight trusted-baseline validity
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          cp benchmark-tools/harness/src/main.rs /tmp/flock-preflight-harness-main.rs
          trap 'cp /tmp/flock-preflight-harness-main.rs benchmark-tools/harness/src/main.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path("benchmark-tools/harness/src/main.rs")
          s=p.read_text()
          old='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          new='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              if let Ok(value) = std::env::var("FLOCK_DIAG_SEED") {
                  let seed: u64 = value.parse()?;
                  eprintln!("HARNESS_EFFECTIVE_SEED={seed}");
                  return Ok(seed);
              }
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          if old not in s: raise SystemExit("fresh_seed source mismatch")
          p.write_text(s.replace(old,new,1))
          PY
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/preflight-harness -p flock-benchmark-harness
          echo "=== VERIFY HARNESS SEED CONTROL ==="
          grep -n -C 5 'fresh_seed()' benchmark-tools/harness/src/main.rs
          if ! grep -q 'FLOCK_DIAG_SEED' benchmark-tools/harness/src/main.rs; then
            echo "::error::Harness ignores FLOCK_DIAG_SEED; deterministic benchmark claims are invalid. Stop before expensive proofs."
            exit 87
          fi
          HARNESS="$PWD/target/preflight-harness/challenge/flock_benchmark_harness"
          BASE="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
          test -x "$HARNESS"; test -x "$BASE"
          : > "$GITHUB_WORKSPACE/snark-preflight.log"
          pass=0
          for attempt in 1 2 3; do
            scratch="$PWD/benchmark-results/preflight-$attempt"
            rm -rf "$scratch"
            mkdir -p "$scratch"
            rm -f score.json
            echo "=== PREFLIGHT attempt=$attempt/3 baseline seed=0 threads=1 ===" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            set +e
            FLOCK_DIAG_SEED=0 "$HARNESS" "$BASE" "$scratch" "$PWD/score.json" \
              "$PWD/benchmark-results/preflight-$attempt.md" 18 1 0 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ] && python3 - <<'PY'
          import json
          d=json.load(open("score.json"))
          assert isinstance(d.get("score"),(int,float)) and d["score"] > 0
          PY
            then
              pass=$((pass+1))
              echo "PREFLIGHT_ATTEMPT_PASS attempt=$attempt" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            else
              echo "PREFLIGHT_ATTEMPT_FAIL attempt=$attempt rc=$rc" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
              echo "PREFLIGHT_SUMMARY passes=$pass/$attempt (early stop)" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
              echo "::error::Trusted baseline verification failed at attempt $attempt; aborting before further costly proofs or candidate build."
              exit 86
            fi
          done
          echo "PREFLIGHT_SUMMARY passes=$pass/3" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
          if [ "$pass" -lt 3 ]; then
            echo "::error::Trusted baseline is not deterministic on this hosted runner ($pass/3 valid). Candidate was not built or measured."
            exit 86
          fi
          seed_lines="$(grep -c 'HARNESS_EFFECTIVE_SEED=0' "$GITHUB_WORKSPACE/snark-preflight.log" || true)"
          if [ "$seed_lines" -ne 3 ]; then
            echo "::error::Expected three explicit seed=0 confirmations, found $seed_lines."
            exit 87
          fi
          echo "PREFLIGHT_PASS trusted baseline verified 3/3" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"

      - name: Reliable single-thread paired A/B gate
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          cp benchmark-tools/harness/src/main.rs /tmp/flock-harness-main.rs
          trap 'cp /tmp/flock-harness-main.rs benchmark-tools/harness/src/main.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path("benchmark-tools/harness/src/main.rs")
          s=p.read_text()
          old='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          new='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              if let Ok(value) = std::env::var("FLOCK_DIAG_SEED") {
                  let seed: u64 = value.parse()?;
                  eprintln!("HARNESS_EFFECTIVE_SEED={seed}");
                  return Ok(seed);
              }
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          if old not in s: raise SystemExit("fresh_seed source mismatch")
          p.write_text(s.replace(old,new,1))
          PY
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/seed-diagnostic -p flock-benchmark-harness
          HARNESS="$PWD/target/seed-diagnostic/challenge/flock_benchmark_harness"
          # Use the exact worker produced by the challenge setup as the baseline.
          # Rebuilding it with a different RUSTFLAGS target changes the binary and has
          # already produced verifier-invalid proofs on some hosted runners.
          BASE="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
          test -x "$HARNESS"; test -x "$BASE"
          sha256sum "$BASE" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          seeds="0 1 54324593501110620 9223372036854775807 9223372036854775808 18446744073709551615"
          threads=1
          rm -rf benchmark-results/ab
          mkdir -p benchmark-results/ab
          : > "$GITHUB_WORKSPACE/snark-ab.log"
          : > "$GITHUB_WORKSPACE/snark-ab.tsv"

          echo "=== PROFILE-ONLY BASELINE: no optimization candidate selected ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          echo "Profiling six trusted baseline seeds with proof verification; no performance improvement will be claimed." | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          for seed in $seeds; do
            scratch="$PWD/benchmark-results/ab/baseline-$seed"
            rm -rf "$scratch"; mkdir -p "$scratch"; rm -f score.json
            echo "=== baseline seed=$seed ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            FLOCK_ZC_TIMING=1 FLOCK_DIAG_SEED="$seed" /usr/bin/time -v "$HARNESS" "$BASE" "$scratch" "$PWD/score.json" \
              "$PWD/benchmark-results/ab/baseline-$seed.md" 18 "$threads" 0 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            python3 - "$seed" "$GITHUB_WORKSPACE/snark-ab.tsv" <<'PY'
          import json,sys
          seed,out=sys.argv[1:]
          d=json.load(open("score.json"))
          score=d.get("score")
          if not isinstance(score,(int,float)) or score <= 0:
              raise SystemExit("invalid verified baseline score")
          with open(out,"a") as f: f.write(f"baseline\t{seed}\t{score}\n")
          PY
          done
          python3 - "$GITHUB_WORKSPACE/snark-ab.log" "$GITHUB_WORKSPACE/snark-baseline-profile-summary.txt" <<'PY'
          import re,statistics,sys
          log=open(sys.argv[1]).read()
          scores=[float(x) for x in re.findall(r'^measured_trial=1/1 trial_score=([0-9.]+).*verified=true',log,re.M)]
          rss=[int(x) for x in re.findall(r'Maximum resident set size \(kbytes\): (\d+)',log)]
          wall=[x for x in re.findall(r'Elapsed \(wall clock\) time \(h:mm:ss or m:ss\): (\S+)',log)]
          if len(scores)!=6 or len(rss)!=6 or len(wall)!=6:
              raise SystemExit(f"incomplete profile: scores={len(scores)} rss={len(rss)} wall={len(wall)}")
          with open(sys.argv[2],"w") as f:
              f.write(f"baseline_trials=6 verified=6 median_score={statistics.median(scores):.3f}\n")
              f.write(f"median_peak_rss_mib={statistics.median(rss)/1024:.1f}\n")
              f.write(f"elapsed_wall_samples={','.join(wall)}\n")
              f.write("No candidate measured. These are process-level measurements, not prover phase attribution.\n")
          print(open(sys.argv[2]).read())
          PY
          # The trusted BASE is a prebuilt worker; its timing code may be
          # compiled out. Preserve it unchanged and record the reason before
          # attempting further baseline-only profiling.
          echo "=== POST-BENCHMARK ZEROCHECK TIMING ACTIVATION AUDIT ===" >> "$GITHUB_WORKSPACE/snark-zc-timing-audit.txt"
          {
            echo "=== source context ==="
            rg -n -C 22 --fixed-strings '[zc-timing]' crates/ || true
            echo "=== source gating ==="
            rg -n -C 4 'FLOCK_ZC_TIMING|cfg\\(debug_assertions\\)|cfg\\(feature|zc.timing' crates/flock-core/src crates/flock-prover/src || true
            echo "=== baseline worker identity ==="
            sha256sum "$BASE"
            file "$BASE"
            echo "=== embedded timing marker ==="
            if grep -aFq '[zc-timing]' "$BASE"; then
              echo "TIMING_MARKER_EMBEDDED=yes"
            else
              echo "TIMING_MARKER_EMBEDDED=no"
            fi
          } >> "$GITHUB_WORKSPACE/snark-zc-timing-audit.txt"
          echo "=== ZEROCHECK PHASE TIMINGS (diagnostic only) ===" | tee "$GITHUB_WORKSPACE/snark-zc-phase-timings.txt"
          grep -F '[zc-timing]' "$GITHUB_WORKSPACE/snark-ab.log" | tee -a "$GITHUB_WORKSPACE/snark-zc-phase-timings.txt" || true
          if ! grep -Fq '[zc-timing]' "$GITHUB_WORKSPACE/snark-zc-phase-timings.txt"; then
            echo "::notice::No Zerocheck phase timings emitted by baseline worker; diagnostic unavailable."
          fi
          echo "PROFILE_ONLY_COMPLETE: 6 verified baseline trials; no candidate measured; Yukon submission disabled." | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
      - name: Capture Zerocheck diagnostic source and CPU dispatch
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/snark-timing-hooks.txt"
          {
            echo "SOURCE_DIAGNOSTICS_ONLY; no optimization candidate measured"
            echo "=== CPU architecture and features ==="
            lscpu
            echo "=== Zerocheck timing references ==="
            rg -n -C 6 --fixed-strings '[zc-timing]' crates/ || true
            echo "=== Zerocheck verifier final check ==="
            sed -n '1300,1360p' crates/flock-core/src/zerocheck.rs
            echo "=== Arithmetic dispatch and target features ==="
            rg -n -m 30 'target_feature|is_x86_feature_detected|target-cpu|avx2|avx512|pclmulqdq' crates/flock-core/src crates/flock-prover/src || true
          } > "$out"
          echo "Diagnostics only; proof gate and Yukon lock unchanged." >> "$out"

      - name: Require explicit Yukon release
        if: ${{ inputs.submit != true }}
        run: |
          echo "Local benchmark completed. Yukon submission withheld by default."
      - name: Submit to Yukon
        if: ${{ false }}
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submit --track x86 --note-file "$GITHUB_WORKSPACE/snark-x86-note.md" --model "GPT-5.6 Sol" --harness "ChatGPT" 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-submit.log"
      - name: Query status
        if: always()
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-after.json" || true
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-submit-receipt
          path: |
            snark-candidate.diff
            snark-before.json
            yukon-snark-submit.log
            snark-local-score.txt
            snark-local-gain.txt
            snark-single-thread-score.json
            snark-four-thread-score.json
            snark-single-thread.log
            snark-four-thread.log
            snark-preflight.log
            snark-ab.log
            snark-ab.tsv
            snark-baseline-profile-summary.txt
            snark-timing-hooks.txt
            snark-zc-phase-timings.txt
            snark-zc-timing-audit.txt
            snark-worker-env-audit.txt
            snark-repro-fingerprint.txt
            snark-runner-env.txt
            snark-proof-source-inspection.txt
            snark-baseline-build-audit.txt
            snark-lookahead-source.txt
            snark-zerocheck-source.rs
            snark-divergence.log
            snark-setup-baseline.sha256
            snark-crossenv-env.txt
            snark-crossenv-sha256.txt
            snark-crossenv-files.txt
            snark-proof-chunks.sha256
            seed0.proof
            snark-crossenv-capture/**
            yukon-snark-after.json
          if-no-files-found: ignore
