name: SNARK.fast x86 candidate benchmark
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit candidate to Yukon after benchmark gate passes"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  snark-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon CLI
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -n "${YUKON_API_TOKEN:-}"
      - name: Clone linked x86 worktree
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Confirm Yukon linkage
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json > "$GITHUB_WORKSPACE/snark-before.json"
      - name: Record runner environment
        run: |
          set -euo pipefail
          echo "ImageOS=${ImageOS:-unknown}" | tee "$GITHUB_WORKSPACE/snark-runner-env.txt"
          echo "ImageVersion=${ImageVersion:-unknown}" | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"
          uname -a | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"
          lscpu | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"

      - name: Prepare benchmark dependencies
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          ./setup.sh

      - name: Deterministic paired A/B gate
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          cp benchmark-tools/harness/src/main.rs /tmp/flock-harness-main.rs
          python3 - <<'PY'
          from pathlib import Path
          p=Path("benchmark-tools/harness/src/main.rs")
          s=p.read_text()
          old='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          new='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              if let Ok(value) = std::env::var("FLOCK_DIAG_SEED") {
                  return Ok(value.parse()?);
              }
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          if old not in s: raise SystemExit("fresh_seed source mismatch")
          p.write_text(s.replace(old,new,1))
          PY
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/seed-diagnostic -p flock-benchmark-harness
          HARNESS="$PWD/target/seed-diagnostic/challenge/flock_benchmark_harness"
          BASE="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
          test -x "$HARNESS"; test -x "$BASE"
          mkdir -p benchmark-results/ab/scratch
          : > "$GITHUB_WORKSPACE/snark-ab.log"
          : > "$GITHUB_WORKSPACE/snark-ab.tsv"
          threads="$(nproc)"
          seeds="0 1 54324593501110620 9223372036854775807 9223372036854775808 18446744073709551615"

          echo "=== CLEAN BASELINE PHASE ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          for seed in $seeds; do
            rm -f score.json
            echo "=== baseline seed=$seed ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            FLOCK_DIAG_SEED="$seed" "$HARNESS" "$BASE" \
              "$PWD/benchmark-results/ab/scratch" "$PWD/score.json" \
              "$PWD/benchmark-results/ab/summary.md" 18 "$threads" 0 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            python3 - "$seed" "$GITHUB_WORKSPACE/snark-ab.tsv" <<'PY'
          import json,sys
          seed,out=sys.argv[1:]
          d=json.load(open("score.json")); score=d.get("score")
          if not isinstance(score,(int,float)) or score <= 0: raise SystemExit("invalid baseline score")
          with open(out,"a") as f: f.write(f"baseline\t{seed}\t{score}\n")
          PY
          done

          echo "=== BUILD CANDIDATE AFTER BASELINE ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("crates/flock-core/src/pcs/ring_switch.rs")
          s=p.read_text()
          old='std::env::var_os("FLOCK_NO_RS_REUSE_FOLD8_A").is_none()'
          new='std::env::var_os("FLOCK_NO_RS_REUSE_FOLD8_A").is_some()'
          if old not in s: raise SystemExit("Fold8 reuse switch source mismatch")
          p.write_text(s.replace(old,new,1))
          PY
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/ab-candidate -p flock-benchmark-worker
          CAND="$PWD/target/ab-candidate/challenge/flock-benchmark-worker"
          test -x "$CAND"

          echo "=== CANDIDATE PHASE ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          for seed in $seeds; do
            rm -f score.json
            echo "=== candidate seed=$seed ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            FLOCK_DIAG_SEED="$seed" "$HARNESS" "$CAND" \
              "$PWD/benchmark-results/ab/scratch" "$PWD/score.json" \
              "$PWD/benchmark-results/ab/summary.md" 18 "$threads" 0 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            python3 - "$seed" "$GITHUB_WORKSPACE/snark-ab.tsv" <<'PY'
          import json,sys
          seed,out=sys.argv[1:]
          d=json.load(open("score.json")); score=d.get("score")
          if not isinstance(score,(int,float)) or score <= 0: raise SystemExit("invalid candidate score")
          with open(out,"a") as f: f.write(f"candidate\t{seed}\t{score}\n")
          PY
          done

          python3 - "$GITHUB_WORKSPACE/snark-ab.tsv" <<'PY' | tee "$GITHUB_WORKSPACE/snark-local-gain.txt"
          import sys,statistics
          rows=[x.strip().split("\t") for x in open(sys.argv[1]) if x.strip()]
          d={}
          for variant,seed,score in rows: d.setdefault(seed,{})[variant]=float(score)
          gains=[]
          for seed in d:
              b=d[seed]["baseline"]; cc=d[seed]["candidate"]
              g=(cc/b-1)*100; gains.append(g)
              print(f"seed={seed} baseline={b:.3f} candidate={cc:.3f} gain={g:+.3f}%")
          med=statistics.median(gains); wins=sum(g>0 for g in gains)
          print(f"paired_median_gain={med:+.3f}% wins={wins}/{len(gains)}")
          print("GATE_PASS" if med >= 2.0 and wins >= 5 else "GATE_REJECT")
          PY
          cp /tmp/flock-harness-main.rs benchmark-tools/harness/src/main.rs

      - name: Require explicit Yukon release
        if: ${{ inputs.submit != true }}
        run: |
          echo "Local benchmark completed. Yukon submission withheld by default."
      - name: Submit to Yukon
        if: ${{ false }}
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submit --track x86 --note-file "$GITHUB_WORKSPACE/snark-x86-note.md" --model "GPT-5.6 Sol" --harness "ChatGPT" 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-submit.log"
      - name: Query status
        if: always()
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-after.json" || true
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-submit-receipt
          path: |
            snark-candidate.diff
            snark-before.json
            yukon-snark-submit.log
            snark-local-score.txt
            snark-local-gain.txt
            snark-single-thread-score.json
            snark-four-thread-score.json
            snark-single-thread.log
            snark-four-thread.log
            snark-ab.log
            snark-ab.tsv
            snark-runner-env.txt
            yukon-snark-after.json
          if-no-files-found: ignore
