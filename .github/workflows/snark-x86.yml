name: SNARK.fast x86 allocator experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [snark-x86-note.md, .github/workflows/snark-x86.yml]
permissions:
  contents: read
jobs:
  snark-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon CLI
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -n "${YUKON_API_TOKEN:-}"
      - name: Clone linked x86 worktree
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"; cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Confirm Yukon linkage
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json >"$GITHUB_WORKSPACE/snark-before.json"
      - name: Apply isolated allocator threshold experiment
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          FILE=crates/flock-prover/src/recycle_alloc.rs
          test "$(git rev-parse HEAD)" = "1b55c6ee2c9cae3c807489293199760e5e21d52b"
          grep -Fxq 'const RECYCLE_MIN: usize = 32 * 1024;' "$FILE"
          sed -i 's/^const RECYCLE_MIN: usize = 32 \* 1024;$/const RECYCLE_MIN: usize = 16 * 1024;/' "$FILE"
          grep -Fxq 'const RECYCLE_MIN: usize = 16 * 1024;' "$FILE"
          git diff --check
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "$FILE"
          git diff -- "$FILE" | tee "$GITHUB_WORKSPACE/snark-candidate.diff"
      - name: Setup x86
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon setup --track x86
      - name: Submit to Yukon
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submit --track x86 --note-file "$GITHUB_WORKSPACE/snark-x86-note.md" --model "GPT-5.6 Sol" --harness "ChatGPT" 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-submit.log"
      - name: Query status
        if: always()
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-after.json" || true
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-submit-receipt
          path: |
            yukon-help.txt
            yukon-clone-help.txt
            yukon-submissions-help.txt
            yukon-recycle_alloc.rs
            yukon-allocator-summary.txt
            snark-baseline.txt
            snark-candidate.diff
            snark-before.json
            yukon-snark-submit.log
            yukon-snark-after.json
          if-no-files-found: ignore
