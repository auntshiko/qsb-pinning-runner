name: SNARK.fast x86 candidate benchmark
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit candidate to Yukon after benchmark gate passes"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  snark-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon CLI
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -n "${YUKON_API_TOKEN:-}"
      - name: Clone linked x86 worktree
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Confirm Yukon linkage
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json > "$GITHUB_WORKSPACE/snark-before.json"
      - name: Record runner environment
        run: |
          set -euo pipefail
          echo "ImageOS=${ImageOS:-unknown}" | tee "$GITHUB_WORKSPACE/snark-runner-env.txt"
          echo "ImageVersion=${ImageVersion:-unknown}" | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"
          uname -a | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"
          lscpu | tee -a "$GITHUB_WORKSPACE/snark-runner-env.txt"

      - name: Prepare benchmark dependencies
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          ./setup.sh

      - name: Require verifier-compatible x86 host
        run: |
          set -euo pipefail
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Benchmark host: $model"
          case "$model" in
            *"XEON"*"8573C"*|*"Xeon"*"8573C"*)
              echo "HOST_COMPAT_PASS: known verifier-compatible Intel Xeon 8573C"
              ;;
            *)
              echo "::error::Unsupported hosted CPU for trusted SNARK baseline: $model. Known-valid reference is Intel Xeon Platinum 8573C; candidate was not built or measured."
              exit 86
              ;;
          esac

      - name: Preflight trusted-baseline validity
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          cp benchmark-tools/harness/src/main.rs /tmp/flock-preflight-harness-main.rs
          trap 'cp /tmp/flock-preflight-harness-main.rs benchmark-tools/harness/src/main.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path("benchmark-tools/harness/src/main.rs")
          s=p.read_text()
          old='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          new='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              if let Ok(value) = std::env::var("FLOCK_DIAG_SEED") {
                  return Ok(value.parse()?);
              }
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          if old not in s: raise SystemExit("fresh_seed source mismatch")
          p.write_text(s.replace(old,new,1))

          # Combine with the independent NTT shaped-kernel selector rollback.
          # The old single-score test measured this alone at -0.890%; the
          # combination is only promoted if the hardened paired gate clears 2%.
          s=p.read_text()
          old='std::sync::LazyLock::new(|| std::env::var_os("FLOCK_NO_NTT_SHAPED").is_none());'
          new='std::sync::LazyLock::new(|| std::env::var_os("FLOCK_NO_NTT_SHAPED").is_some());'
          if old not in s: raise SystemExit("NTT shaped-kernel selector source mismatch")
          if s.count(old) != 1: raise SystemExit("unexpected NTT shaped-kernel selector occurrence count")
          p.write_text(s.replace(old,new,1))
          PY
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/preflight-harness -p flock-benchmark-harness
          HARNESS="$PWD/target/preflight-harness/challenge/flock_benchmark_harness"
          BASE="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
          test -x "$HARNESS"; test -x "$BASE"
          : > "$GITHUB_WORKSPACE/snark-preflight.log"
          pass=0
          for attempt in 1 2 3; do
            scratch="$PWD/benchmark-results/preflight-$attempt"
            rm -rf "$scratch"
            mkdir -p "$scratch"
            rm -f score.json
            echo "=== PREFLIGHT attempt=$attempt/3 baseline seed=0 threads=1 ===" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            set +e
            FLOCK_DIAG_SEED=0 "$HARNESS" "$BASE" "$scratch" "$PWD/score.json" \
              "$PWD/benchmark-results/preflight-$attempt.md" 18 1 0 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ] && python3 - <<'PY'
          import json
          d=json.load(open("score.json"))
          assert isinstance(d.get("score"),(int,float)) and d["score"] > 0
          PY
            then
              pass=$((pass+1))
              echo "PREFLIGHT_ATTEMPT_PASS attempt=$attempt" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            else
              echo "PREFLIGHT_ATTEMPT_FAIL attempt=$attempt rc=$rc" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
            fi
          done
          echo "PREFLIGHT_SUMMARY passes=$pass/3" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"
          if [ "$pass" -lt 3 ]; then
            echo "::error::Trusted baseline is not deterministic on this hosted runner ($pass/3 valid). Candidate was not built or measured."
            exit 86
          fi
          echo "PREFLIGHT_PASS trusted baseline verified 3/3" | tee -a "$GITHUB_WORKSPACE/snark-preflight.log"

      - name: Reliable single-thread paired A/B gate
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          cp benchmark-tools/harness/src/main.rs /tmp/flock-harness-main.rs
          trap 'cp /tmp/flock-harness-main.rs benchmark-tools/harness/src/main.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path("benchmark-tools/harness/src/main.rs")
          s=p.read_text()
          old='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          new='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              if let Ok(value) = std::env::var("FLOCK_DIAG_SEED") {
                  return Ok(value.parse()?);
              }
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          if old not in s: raise SystemExit("fresh_seed source mismatch")
          p.write_text(s.replace(old,new,1))
          PY
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/seed-diagnostic -p flock-benchmark-harness
          HARNESS="$PWD/target/seed-diagnostic/challenge/flock_benchmark_harness"
          # Use the exact worker produced by the challenge setup as the baseline.
          # Rebuilding it with a different RUSTFLAGS target changes the binary and has
          # already produced verifier-invalid proofs on some hosted runners.
          BASE="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
          test -x "$HARNESS"; test -x "$BASE"
          sha256sum "$BASE" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          seeds="0 1 54324593501110620 9223372036854775807 9223372036854775808 18446744073709551615"
          threads=1
          rm -rf benchmark-results/ab
          mkdir -p benchmark-results/ab
          : > "$GITHUB_WORKSPACE/snark-ab.log"
          : > "$GITHUB_WORKSPACE/snark-ab.tsv"

          echo "=== BASELINE RELIABILITY PHASE threads=$threads ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          for seed in $seeds; do
            scratch="$PWD/benchmark-results/ab/baseline-$seed"
            rm -rf "$scratch"; mkdir -p "$scratch"; rm -f score.json
            echo "=== baseline seed=$seed ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            FLOCK_DIAG_SEED="$seed" "$HARNESS" "$BASE" "$scratch" "$PWD/score.json" \
              "$PWD/benchmark-results/ab/baseline-$seed.md" 18 "$threads" 0 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            python3 - "$seed" "$GITHUB_WORKSPACE/snark-ab.tsv" <<'PY'
          import json,sys
          seed,out=sys.argv[1:]
          d=json.load(open("score.json")); score=d.get("score")
          if not isinstance(score,(int,float)) or score <= 0: raise SystemExit("invalid baseline score")
          with open(out,"a") as f: f.write(f"baseline\t{seed}\t{score}\n")
          PY
          done

          echo "=== BUILD COMBINED NTT CANDIDATE: disable deep-pass L1 prefetch + generic deep-row dispatch ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("crates/flock-core/src/ntt/additive_ntt_f128.rs")
          s=p.read_text()
          old='if std::env::var_os("FLOCK_NO_NTT_DEEP_PF").is_some() {'
          new='if std::env::var_os("FLOCK_NO_NTT_DEEP_PF").is_none() {'
          if old not in s: raise SystemExit("NTT deep-prefetch selector source mismatch")
          if s.count(old) != 1: raise SystemExit("unexpected NTT deep-prefetch selector occurrence count")
          p.write_text(s.replace(old,new,1))
          PY
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" \
            cargo +1.97.0 build --locked --offline --profile challenge \
            --manifest-path Cargo.toml --target-dir target/ab-candidate -p flock-benchmark-worker
          CAND="$PWD/target/ab-candidate/challenge/flock-benchmark-worker"
          test -x "$CAND"

          echo "=== CANDIDATE PHASE threads=$threads ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
          for seed in $seeds; do
            scratch="$PWD/benchmark-results/ab/candidate-$seed"
            rm -rf "$scratch"; mkdir -p "$scratch"; rm -f score.json
            echo "=== candidate seed=$seed ===" | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            FLOCK_DIAG_SEED="$seed" "$HARNESS" "$CAND" "$scratch" "$PWD/score.json" \
              "$PWD/benchmark-results/ab/candidate-$seed.md" 18 "$threads" 0 1 \
              2>&1 | tee -a "$GITHUB_WORKSPACE/snark-ab.log"
            python3 - "$seed" "$GITHUB_WORKSPACE/snark-ab.tsv" <<'PY'
          import json,sys
          seed,out=sys.argv[1:]
          d=json.load(open("score.json")); score=d.get("score")
          if not isinstance(score,(int,float)) or score <= 0: raise SystemExit("invalid candidate score")
          with open(out,"a") as f: f.write(f"candidate\t{seed}\t{score}\n")
          PY
          done

          python3 - "$GITHUB_WORKSPACE/snark-ab.tsv" <<'PY' | tee "$GITHUB_WORKSPACE/snark-local-gain.txt"
          import sys,statistics
          rows=[x.strip().split("\t") for x in open(sys.argv[1]) if x.strip()]
          d={}
          for variant,seed,score in rows: d.setdefault(seed,{})[variant]=float(score)
          if len(d) != 6 or any(set(v) != {"baseline","candidate"} for v in d.values()):
              raise SystemExit("incomplete paired benchmark")
          gains=[]
          for seed,v in d.items():
              b=v["baseline"]; c=v["candidate"]; g=(c/b-1)*100
              gains.append(g); print(f"seed={seed} baseline={b:.3f} candidate={c:.3f} gain={g:+.3f}%")
          med=statistics.median(gains); wins=sum(g>0 for g in gains)
          print(f"paired_median_gain={med:+.3f}% wins={wins}/6")
          if med >= 2.0 and wins >= 5:
              print("GATE_PASS")
          else:
              print("GATE_REJECT")
              raise SystemExit(2)
          PY

      - name: Require explicit Yukon release
        if: ${{ inputs.submit != true }}
        run: |
          echo "Local benchmark completed. Yukon submission withheld by default."
      - name: Submit to Yukon
        if: ${{ false }}
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submit --track x86 --note-file "$GITHUB_WORKSPACE/snark-x86-note.md" --model "GPT-5.6 Sol" --harness "ChatGPT" 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-submit.log"
      - name: Query status
        if: always()
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-after.json" || true
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-submit-receipt
          path: |
            snark-candidate.diff
            snark-before.json
            yukon-snark-submit.log
            snark-local-score.txt
            snark-local-gain.txt
            snark-single-thread-score.json
            snark-four-thread-score.json
            snark-single-thread.log
            snark-four-thread.log
            snark-preflight.log
            snark-ab.log
            snark-ab.tsv
            snark-runner-env.txt
            yukon-snark-after.json
          if-no-files-found: ignore
