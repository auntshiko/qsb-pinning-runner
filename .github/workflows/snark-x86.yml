name: SNARK.fast x86 allocator experiment
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths: [snark-x86-note.md, .github/workflows/snark-x86.yml]
permissions:
  contents: read
jobs:
  snark-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon CLI
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -n "${YUKON_API_TOKEN:-}"
      - name: Clone linked x86 worktree
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Confirm Yukon linkage
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json > "$GITHUB_WORKSPACE/snark-before.json"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            cat "$GITHUB_WORKSPACE/snark-before.json"
            exit 0
          fi
      - name: Apply isolated allocator threshold experiment
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          FILE=crates/flock-core/src/lib.rs
          test "$(git rev-parse HEAD)" = "1b55c6ee2c9cae3c807489293199760e5e21d52b"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/flock-core/src/lib.rs")
          s = p.read_text()
          old = 'pub(crate) const POOL_MODE: &str = "pin16";'
          new = 'pub(crate) const POOL_MODE: &str = "phys8";'
          if s.count(old) != 1:
              raise SystemExit(f"expected exactly one baseline constant, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          if p.read_text().count(new) != 1:
              raise SystemExit("candidate replacement verification failed")
          PY
          echo "Validated candidate: POOL_MODE=phys8" > "$GITHUB_WORKSPACE/snark-candidate.diff"
      - name: Setup x86
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon setup --track x86
      - name: Submit to Yukon
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yukon submit --track x86 --note-file "$GITHUB_WORKSPACE/snark-x86-note.md" --model "GPT-5.6 Sol" --harness "ChatGPT" 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-submit.log"
      - name: Query status
        if: always()
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yukon submissions --json 2>&1 | tee "$GITHUB_WORKSPACE/yukon-snark-after.json" || true
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-submit-receipt
          path: |
            snark-candidate.diff
            snark-before.json
            yukon-snark-submit.log
            yukon-snark-after.json
          if-no-files-found: ignore
