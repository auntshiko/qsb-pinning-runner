name: SNARK x86 baseline profile only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon and clone challenge
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          export PATH="$HOME/.local/bin:$PATH"
          test -n "${YUKON_API_TOKEN:-}"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Prepare trusted baseline
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          ./setup.sh
      - name: Inspect profiling hooks and source revision
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/profile-revision.txt"
          lscpu | grep -E 'Model name|Architecture|Vendor ID|Flags' | tee "$GITHUB_WORKSPACE/profile-cpu.txt"
          echo "=== RUNTIME CPU FEATURE PROBE ===" | tee "$GITHUB_WORKSPACE/profile-runtime-cpu.txt"
          python3 - <<'PY' | tee -a "$GITHUB_WORKSPACE/profile-runtime-cpu.txt"
          import platform
          print("machine:", platform.machine())
          for line in open("/proc/cpuinfo"):
              if line.startswith(("model name", "flags", "vendor_id")):
                  print(line.strip())
                  if line.startswith("flags"): break
          PY
          echo "=== BASELINE BUILD FINGERPRINT ===" | tee "$GITHUB_WORKSPACE/profile-binary-fingerprint.txt"
          sha256sum target/challenge-candidate/challenge/flock-benchmark-worker | tee -a "$GITHUB_WORKSPACE/profile-binary-fingerprint.txt"
          grep -nE 'RUSTFLAGS|target-cpu|cargo .*build|flock-benchmark-worker' setup.sh | head -70 | tee -a "$GITHUB_WORKSPACE/profile-binary-fingerprint.txt" || true
          echo "=== CPU / BINARY DISPATCH REFERENCES ===" > "$GITHUB_WORKSPACE/profile-dispatch.txt"
          grep -RInE 'is_x86_feature_detected!|target_feature|target_cpu|target-cpu|avx2|pclmulqdq|vpclmulqdq|gfni' crates/flock-core/src crates/flock-prover/src | head -180 >> "$GITHUB_WORKSPACE/profile-dispatch.txt" || true
          echo "=== PROVER TIMING OUTPUT REFERENCES ===" > "$GITHUB_WORKSPACE/profile-stage-timing.txt"
          grep -RInE 'witness_s|commit_s|zerocheck_s|lincheck_s|proof.*timing|stage.*timing' crates/flock-prover/src/r1cs_hashes/blake3.rs | head -140 >> "$GITHUB_WORKSPACE/profile-stage-timing.txt" || true
          grep -RInE 'zerocheck_s|lincheck_s|witness_s|commit_s|ring.switch|Instant::now|elapsed\(' crates/flock-prover/src/r1cs_hashes/blake3.rs | head -160 > "$GITHUB_WORKSPACE/profile-timing-hooks.txt" || true
          cp crates/flock-core/src/zerocheck.rs "$GITHUB_WORKSPACE/profile-zerocheck.rs"
      - name: Capture determinism and parallelism configuration
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          {
            echo "=== CHALLENGE REVISION ==="
            git rev-parse HEAD
            echo "=== RUNTIME PARALLELISM ==="
            env | grep -E '^(RAYON_|OMP_|RUSTFLAGS|CARGO_|FLOCK_)' | sed -E 's/(TOKEN|KEY|SECRET|PASSWORD)=[^ ]+/\\1=[REDACTED]/g' || true
            echo "=== PROVER PARALLELISM AND RANDOMNESS REFERENCES ==="
            grep -RInE 'par_iter|into_par_iter|thread_rng|OsRng|/dev/urandom|available_parallelism|RAYON_NUM_THREADS|FLOCK_NO_ZC_LOOKAHEAD' crates/flock-core/src/zerocheck.rs crates/flock-prover/src/r1cs_hashes/blake3.rs | head -120 || true
          } > "$GITHUB_WORKSPACE/profile-determinism.txt"
          echo "Determinism configuration captured"
      - name: Profile one trusted baseline proof
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("benchmark-tools/harness/src/main.rs")
          s=p.read_text()
          old='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          new='''fn fresh_seed() -> Result<u64, Box<dyn std::error::Error>> {
              if let Ok(value) = std::env::var("FLOCK_DIAG_SEED") {
                  return Ok(value.parse()?);
              }
              let mut bytes = [0u8; 8];
              File::open("/dev/urandom")?.read_exact(&mut bytes)?;
              Ok(u64::from_le_bytes(bytes))
          }'''
          if old not in s: raise SystemExit("seed hook changed; stop safely")
          p.write_text(s.replace(old,new,1))
          PY
          CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true RUSTFLAGS="-C target-cpu=native" cargo +1.97.0 build --locked --offline --profile challenge --manifest-path Cargo.toml --target-dir target/profile-harness -p flock-benchmark-harness
          HARNESS="$PWD/target/profile-harness/challenge/flock_benchmark_harness"
          BASE="$PWD/target/challenge-candidate/challenge/flock-benchmark-worker"
          test -x "$HARNESS"; test -x "$BASE"
          mkdir -p benchmark-results/profile-only
          set +e
          FLOCK_DIAG_SEED=0 /usr/bin/time -v -o "$GITHUB_WORKSPACE/profile-resource-usage.txt" "$HARNESS" "$BASE" "$PWD/benchmark-results/profile-only" "$PWD/score.json" "$GITHUB_WORKSPACE/profile-report.md" 18 1 0 1 > "$GITHUB_WORKSPACE/profile-execution.log" 2>&1
          rc=$?
          set -e
          echo "TRUSTED_BASELINE_EXIT=$rc" | tee "$GITHUB_WORKSPACE/profile-status.txt"
          echo "=== PROVER STAGE TIMING SIGNALS ===" | tee "$GITHUB_WORKSPACE/profile-stage-results.txt"
          grep -Ei 'witness|commit|zerocheck|lincheck|ring.switch|prover|verify|elapsed|seconds|timing' "$GITHUB_WORKSPACE/profile-execution.log" | tail -90 >> "$GITHUB_WORKSPACE/profile-stage-results.txt" || true
          echo "=== RESOURCE USAGE ==="
          cat "$GITHUB_WORKSPACE/profile-resource-usage.txt" | tail -28
          tail -45 "$GITHUB_WORKSPACE/profile-execution.log"
          if [ "$rc" -ne 0 ]; then
            echo "Baseline verifier failure recorded; diagnostics retained."
            exit 1
          fi
      - name: Collect software timing references
        if: always()
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          grep -nE 'witness_s|commit_s|zerocheck_s|lincheck_s|Instant::now|elapsed' crates/flock-prover/src/r1cs_hashes/blake3.rs > "$GITHUB_WORKSPACE/profile-software-timing.txt" || true
          grep -Ei 'witness|commit|zerocheck|lincheck|timing' "$GITHUB_WORKSPACE/profile-execution.log" >> "$GITHUB_WORKSPACE/profile-software-timing.txt" || true
          echo "Software timing references collected"
      - name: Upload profile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snark-x86-baseline-profile
          if-no-files-found: warn
          path: |
            profile-*.txt
            profile-*.log
            profile-*.md
            profile-*.rs
            profile-software-timing.txt
            work/**/score.json
