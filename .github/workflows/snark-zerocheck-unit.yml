name: SNARK Zerocheck unit correctness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zerocheck-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Yukon CLI and clone challenge
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          export PATH="$HOME/.local/bin:$PATH"
          test -n "${YUKON_API_TOKEN:-}"
          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"
          yukon clone eigenlabs/flock-challenge-multi/x86
          ROOT="$(find "$GITHUB_WORKSPACE/work" -type f -name benchmark.json -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "SNARK_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Prepare Rust and dependencies
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          ./setup.sh
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          rustc +1.97.0 -V
      - name: Repair missing NTT method in isolated test checkout
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/flock-core/src/ntt/additive_ntt_f128.rs")
          src = p.read_text()
          lines = src.splitlines(keepends=True)
          old = "ntt.forward_transform_interleaved_parallel_from_layer("
          new = "ntt.forward_transform_interleaved_from_layer("
          targets = (5683, 5691)
          if any(n > len(lines) or old not in lines[n-1] for n in targets):
              raise SystemExit("Expected NTT test calls absent at lines 5683 and 5691; refusing patch")
          for n in targets:
              lines[n-1] = lines[n-1].replace(old, new, 1)
          src = "".join(lines)
          p.write_text(src)
          print("Patched two test-only NTT call sites; production challenge source remains unchanged.")
          PY
          git diff -- crates/flock-core/src/ntt/additive_ntt_f128.rs > "$GITHUB_WORKSPACE/zerocheck-test-only-ntt.diff"
          test -s "$GITHUB_WORKSPACE/zerocheck-test-only-ntt.diff"
      - name: Run isolated Zerocheck tests with reference assertions
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/zerocheck-unit-results"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/zerocheck-unit-results/revision.txt"
          lscpu > "$GITHUB_WORKSPACE/zerocheck-unit-results/cpu.txt"
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          export RAYON_NUM_THREADS=1
          export RUST_TEST_THREADS=1
          export CARGO_INCREMENTAL=0
          export RUSTFLAGS="-C target-cpu=x86-64"
          set +e
          cargo +1.97.0 test --locked --offline -p flock-core zerocheck -- --nocapture --test-threads=1 > "$GITHUB_WORKSPACE/zerocheck-unit-results/tests.log" 2>&1
          rc=$?
          echo "=== UNIT TEST FAILURE DIAGNOSTICS ==="
          tail -100 "$GITHUB_WORKSPACE/zerocheck-unit-results/tests.log" || true
          echo "=== SUMMARY ==="
          grep -E 'running [0-9]+ tests|test result:|FAILED|panicked at|error:|error\[' "$GITHUB_WORKSPACE/zerocheck-unit-results/tests.log" | tail -35 || true
          echo "UNIT_TEST_EXIT=$rc"
          exit "$rc"
      - name: Capture b-complement stack allocation source
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/zerocheck-unit-results"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/flock-core/src/zerocheck/univariate_skip_optimized/kernels/x86_64_bcomplement.rs")
          out = Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "zerocheck-unit-results/bcomplement-stack-source.txt"
          if not p.exists():
              candidates = list(Path("crates/flock-core/src").rglob("*bcomplement*.rs"))
              out.write_text("Expected source missing. Candidates: " + repr([str(x) for x in candidates]))
              raise SystemExit("B-complement source location changed; inspect artifact")
          lines = p.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if "image_variants_and_residual_bcomplement_match_incumbent" in line]
          if len(matches) != 1:
              raise SystemExit(f"Expected one test declaration, found {len(matches)}")
          i = matches[0]
          start = max(0, i-35)
          end = min(len(lines), i+230)
          out.write_text("\\n".join(f"{n+1}: {lines[n]}" for n in range(start,end))+"\\n")
          print(f"Captured test source {p}:{start+1}-{end} to artifact")
          print("=== STACK-RELATED SOURCE ===")
          for n in range(start,end):
              if any(x in lines[n] for x in ("[F128;", "Box::new", "vec![", "with_capacity", "image_variants", "let mut", "const ")):
                  print(f"{n+1}: {lines[n][:180]}")
          PY
      - name: Isolate native b-complement kernel with larger stack
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -uo pipefail
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          mkdir -p "$GITHUB_WORKSPACE/zerocheck-unit-results"
          export RAYON_NUM_THREADS=1 RUST_TEST_THREADS=1 CARGO_INCREMENTAL=0
          export CARGO_TARGET_DIR="$PWD/target/zerocheck-native-tests"
          export RUSTFLAGS="-C target-cpu=native"
          export RUST_MIN_STACK=134217728
          echo "=== TEST STACK LIMIT ==="
          ulimit -s || true
          echo "RUST_MIN_STACK=$RUST_MIN_STACK"
          echo "=== TEST SOURCE LOCAL ARRAY FOOTPRINT ==="
          sed -n '855,940p' crates/flock-core/src/zerocheck/univariate_skip_optimized/kernels/x86_64_bcomplement.rs | grep -nE 'let |const |Box::|vec!|\[F128;|\[u8;' | head -55 || true
          echo "=== NATIVE CPU FEATURES ==="
          lscpu | grep -E 'Model name:|Flags:|Architecture:' | cut -c1-350 || true
          echo "=== RUSTC NATIVE FEATURE CFG ==="
          rustc +1.97.0 --print cfg -C target-cpu=native | grep -E 'target_feature="(avx512f|vpclmulqdq|avx2)"' || true
          echo "=== B-COMPLEMENT MODULE DECLARATIONS ==="
          grep -R -n -B 9 -A 5 'mod x86_64_bcomplement' crates/flock-core/src/zerocheck | head -65 || true
          echo "=== COMPILED B-COMPLEMENT TEST INVENTORY ==="
          cargo +1.97.0 test --locked --offline -p flock-core -- --list > "$GITHUB_WORKSPACE/zerocheck-unit-results/native-test-list.txt" 2>&1
          grep -E 'bcomplement|image_variants_and_residual' "$GITHUB_WORKSPACE/zerocheck-unit-results/native-test-list.txt" | head -35 || true
          echo "=== B-COMPLEMENT CONDITIONAL COMPILATION ==="
          grep -n -B 10 -A 6 -E 'mod x86_64_bcomplement|cfg\(|image_variants_and_residual_bcomplement_match_incumbent' crates/flock-core/src/zerocheck/univariate_skip_optimized/kernels.rs crates/flock-core/src/zerocheck/univariate_skip_optimized/kernels/mod.rs crates/flock-core/src/zerocheck/univariate_skip_optimized/kernels/x86_64_bcomplement.rs 2>/dev/null | tail -90 || true
          if ! grep -q 'image_variants_and_residual_bcomplement_match_incumbent: test' "$GITHUB_WORKSPACE/zerocheck-unit-results/native-test-list.txt"; then
            echo "::notice::SKIPPED_UNSUPPORTED_CPU: b-complement kernel test not compiled on this runner."
            echo "B_COMPLEMENT_RESULT=SKIPPED_UNSUPPORTED_CPU" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "=== COMPATIBLE CPU: RUNNING TARGETED TEST ==="
          echo "=== FULL FAILING TEST SOURCE (numbered) ==="
          nl -ba crates/flock-core/src/zerocheck/univariate_skip_optimized/kernels/x86_64_bcomplement.rs | sed -n '855,1010p'
          echo "=== KERNEL CALL SITES ==="
          grep -n -E 'fn .*bcomplement|fn .*image|unsafe|stack|Box::|alloca|\[[^]]+; [0-9]{3,}\]' crates/flock-core/src/zerocheck/univariate_skip_optimized/kernels/x86_64_bcomplement.rs | head -90 || true
          echo "B_COMPLEMENT_CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)" >> "$GITHUB_STEP_SUMMARY"
          set +e
          cargo +1.97.0 test --locked --offline -p flock-core image_variants_and_residual_bcomplement_match_incumbent -- --nocapture --test-threads=1 > "$GITHUB_WORKSPACE/zerocheck-unit-results/native-bcomplement.log" 2>&1
          rc=$?
          echo "=== ISOLATED NATIVE B-COMPLEMENT TEST ==="
          tail -45 "$GITHUB_WORKSPACE/zerocheck-unit-results/native-bcomplement.log" || true
          echo "NATIVE_BCOMPLEMENT_EXIT=$rc"
          if grep -Eq 'running 0 tests|0 passed; 0 failed' "$GITHUB_WORKSPACE/zerocheck-unit-results/native-bcomplement.log"; then
            if grep -q 'image_variants_and_residual_bcomplement_match_incumbent: test' "$GITHUB_WORKSPACE/zerocheck-unit-results/native-test-list.txt"; then
              echo "::error::Targeted b-complement test was compiled but did not execute."
              exit 88
            fi
            echo "::notice::SKIPPED_UNSUPPORTED_CPU: native b-complement test absent from compiled inventory; no correctness claim for this kernel."
            echo "B_COMPLEMENT_RESULT=SKIPPED_UNSUPPORTED_CPU" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -Eq 'test result: ok\\. 1 passed; 0 failed' "$GITHUB_WORKSPACE/zerocheck-unit-results/native-bcomplement.log"; then
            echo "::error::Targeted b-complement test did not pass exactly once."
            exit 89
          fi
          exit "$rc"
      - name: Compare native x86 Zerocheck unit behavior
        working-directory: ${{ env.SNARK_ROOT }}
        run: |
          set -uo pipefail
          . "${CARGO_HOME:-$HOME/.cargo}/env"
          mkdir -p "$GITHUB_WORKSPACE/zerocheck-unit-results"
          export RAYON_NUM_THREADS=1 RUST_TEST_THREADS=1 CARGO_INCREMENTAL=0
          export CARGO_TARGET_DIR="$PWD/target/zerocheck-native-tests"
          export RUSTFLAGS="-C target-cpu=native"
          set +e
          cargo +1.97.0 test --locked --offline -p flock-core zerocheck -- --nocapture --test-threads=1 > "$GITHUB_WORKSPACE/zerocheck-unit-results/native-tests.log" 2>&1
          rc=$?
          echo "=== NATIVE CPU LAST TEST EXECUTED ==="
          tail -90 "$GITHUB_WORKSPACE/zerocheck-unit-results/native-tests.log" || true
          echo "=== NATIVE CPU ZEROCHECK TEST SUMMARY ==="
          grep -E 'running [0-9]+ tests|test result:|FAILED|error:|panicked at' "$GITHUB_WORKSPACE/zerocheck-unit-results/native-tests.log" | tail -35 || true
          echo "NATIVE_TEST_EXIT=$rc"
          exit "$rc"
      - name: Upload isolated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerocheck-unit-correctness
          path: zerocheck-unit-results/
          if-no-files-found: warn
